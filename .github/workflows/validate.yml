name: Validate public SolarPilot interface
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify public files and licenses
        run: python scripts/audit-publication.py --index
      - name: Build Windows interface and run all nine test groups
        shell: pwsh
        run: ./scripts/build-windows.ps1
